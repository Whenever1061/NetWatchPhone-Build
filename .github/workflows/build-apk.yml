name: Build NetWatch Phone APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release
        run: gradle --no-daemon assembleRelease

      - name: Restore permanent NetWatch signing key
        id: signing
        env:
          SIGNING_BUNDLE: ${{ secrets.NETWATCH_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .signing
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > .signing/signing.zip
          unzip -q .signing/signing.zip -d .signing
          set -a
          source .signing/signing.env
          set +a
          echo "NETWATCH_STORE_PASSWORD=$NETWATCH_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NETWATCH_KEY_PASSWORD=$NETWATCH_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NETWATCH_KEY_ALIAS=$NETWATCH_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Sign stable release APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk NetWatchPhone-aligned.apk
          "$BT/apksigner" sign \
            --ks .signing/NetWatchPhone-release.p12 \
            --ks-key-alias "$NETWATCH_KEY_ALIAS" \
            --ks-pass "pass:$NETWATCH_STORE_PASSWORD" \
            --key-pass "pass:$NETWATCH_KEY_PASSWORD" \
            --out NetWatchPhone.apk \
            NetWatchPhone-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs NetWatchPhone.apk
          SHA=$(sha256sum NetWatchPhone.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "version_code": 3,
            "version_name": "0.3.0",
            "apk_url": "https://github.com/Whenever1061/NetWatchPhone-Build/releases/download/netwatch-latest/NetWatchPhone.apk",
            "sha256": "$SHA"
          }
          EOF

      - name: Publish stable updater channel
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete netwatch-latest --yes --cleanup-tag 2>/dev/null || true
          git tag -f netwatch-latest "$GITHUB_SHA"
          git push -f origin refs/tags/netwatch-latest
          gh release create netwatch-latest NetWatchPhone.apk update.json \
            --title "NetWatch Phone 0.3.0" \
            --notes "Permanent-signed NetWatch Phone release with built-in GitHub updater."

      - name: Build preview APK when signing is not configured
        if: steps.signing.outputs.configured != 'true'
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk NetWatchPhone-0.3.0-UNSIGNED.apk

      - name: Upload stable APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetWatchPhone-0.3.0-signed
          path: |
            NetWatchPhone.apk
            update.json

      - name: Upload unsigned preview artifact
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetWatchPhone-0.3.0-UNSIGNED
          path: NetWatchPhone-0.3.0-UNSIGNED.apk
